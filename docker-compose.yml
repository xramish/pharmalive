services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: pharmalive
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pharmalive
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pharmalive"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pharmalive:${DB_PASSWORD}@db:5432/pharmalive
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_URL: https://${DOMAIN}

  # Web server in front of the app: gets and renews the free HTTPS certificate automatically.
  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
